services:
  web:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 8089
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
    networks:
      - app_net
networks:
  app_net:
    driver: overlay
