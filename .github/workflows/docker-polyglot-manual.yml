name: Docker Polyglot Smoke (manual)
on:
  workflow_dispatch:
jobs:
  polyglot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker Engine and Compose
        run: |
          docker version
          docker compose version
      - name: Build and smoke test five services
        run: bash scripts/verify-polyglot.sh
      - name: Diagnostics when failing
        if: failure()
        run: |
          cd projects/03-polyglot-microservices
          docker compose ps || true
          docker compose logs --no-color --tail=100 || true
